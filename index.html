<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ChronoCraft | Age Calculator</title>
<style>
  :root {
    --primary: #8b5cf6;
    --secondary: #ec4899;
    --bg-dark: #0f172a;
    --bg-light: #f8fafc;
    --text-dark: #1e293b;
    --text-light: #f8fafc;
  }
  body {
    font-family: 'Poppins', sans-serif;
    background: var(--bg-dark);
    color: var(--text-light);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    min-height: 100vh;
    margin: 0;
    transition: background 0.4s, color 0.4s;
  }
  .light-mode {
    background: var(--bg-light);
    color: var(--text-dark);
  }
  .container {
    width: 90%;
    max-width: 650px;
    background: rgba(255,255,255,0.05);
    border-radius: 1rem;
    padding: 2rem;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
    transition: background 0.4s, color 0.4s;
  }
  .light-mode .container {
    background: #ffffff;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
  h1 {
    font-size: 2.2rem;
    text-align: center;
    margin-bottom: 0.5rem;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  h2 {
    text-align: center;
    font-weight: 500;
    margin-top: 0;
    opacity: 0.8;
  }
  label, select, input {
    display: block;
    width: 100%;
    margin: 0.5rem 0;
    font-size: 1rem;
  }
  select, input[type="number"] {
    padding: 0.6rem;
    border-radius: 0.5rem;
    border: 1px solid #94a3b8;
    background: transparent;
    color: inherit;
  }
  button {
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    color: #fff;
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 0.6rem;
    cursor: pointer;
    font-size: 1rem;
    margin: 0.5rem;
    transition: transform 0.2s;
  }
  button:hover { transform: scale(1.05); }
  .result {
    margin-top: 1.5rem;
    text-align: center;
    line-height: 1.6;
  }
  .toggle-mode {
    position: absolute;
    top: 1rem;
    right: 1rem;
    cursor: pointer;
    font-size: 1.5rem;
  }
  .fun-fact {
    margin-top: 1rem;
    font-style: italic;
    opacity: 0.9;
    text-align: center;
  }
  @media(max-width:600px){
    .container{padding:1.5rem;}
    h1{font-size:1.7rem;}
  }
</style>
</head>
<body>
<div class="toggle-mode" id="modeToggle">🌙</div>
<div class="container">
  <h1>ChronoCraft</h1>
  <h2>Your Personal Time Weaver</h2>
  <form id="ageForm">

    <input type="number" id="day" min="1" max="31" required>
    <label>Month</label>
    <select id="month" required>
      <option value="">--Select Month--</option>
      <option value="1">January</option>
      <option value="2">February</option>
      <option value="3">March</option>
      <option value="4">April</option>
      <option value="5">May</option>
      <option value="6">June</option>
      <option value="7">July</option>
      <option value="8">August</option>
      <option value="9">September</option>
      <option value="10">October</option>
      <option value="11">November</option>
      <option value="12">December</option>
    </select>
    <label>Year</label>
    <input type="number" id="year" min="1900" max="2100" required>
    <label><input type="checkbox" id="addTime"> Add Time of Birth (optional)</label>
    <div id="timeInputs" style="display:none">
