<!DOCTYPE html>
<html lang="en" class="dark"> 

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoCraft | Modern Age Calculator</title>
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5173549373434570"
     crossorigin="anonymous"></script>
    
    <!-- Tailwind CSS --><script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Font: Inter --><link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons --><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <style>
        /* Use the Inter font family */
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Custom styles for the live age counter blocks */
        #age-display .age-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            min-width: 60px;
        }

        #age-display .age-value {
            font-size: 2.25rem; /* 3xl */
            font-weight: 800; /* extrabold */
            line-height: 1.1;
        }

        #age-display .age-label {
            font-size: 0.875rem; /* sm */
            font-weight: 500; /* medium */
            opacity: 0.8;
            text-transform: uppercase;
        }
        
        /* Hide number input spinners */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Custom focus ring color */
        .focus-visible-ring {
            outline: 2px solid transparent;
            outline-offset: 2px;
        }
        .focus-visible-ring:focus-visible {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.6); /* focus:ring-indigo-500 with opacity */
        }

        /* Hide/show theme icons */
        .dark #theme-icon-sun { display: block; }
        .dark #theme-icon-moon { display: none; }
        html:not(.dark) #theme-icon-sun { display: none; }
        html:not(.dark) #theme-icon-moon { display: block; }

        /* FIX for AdSense slot size error */
        .adsbygoogle {
            display: flex !important; /* Ensure it's treated as a block/flex element */
            min-height: 100px; /* Provide a minimum rendering height */
            text-align: center;
            min-width: 250px; /* Crucial fix for the 250px width error */
        }
    </style>

    <script>
        // Set Tailwind dark mode
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen p-4 transition-colors duration-300">

    <main class="w-full mx-auto max-w-7xl">
        <div class="w-full bg-white/70 dark:bg-gray-800/70 backdrop-blur-xl border border-gray-200 dark:border-gray-700/50 rounded-2xl shadow-2xl p-6 md:p-10">
            
            <!-- Header: Title + Theme Toggle -->
            <!-- UPDATED: Added justify-center for centering on desktop, removed items-start (now items-center) -->
            <header class="flex flex-col md:flex-row justify-center items-center mb-8 text-center relative">
                <!-- Title Container -->
                <div class="text-center">
                    <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-500 flex items-center justify-center gap-3">
                        <i data-lucide="gift" class="w-8 h-8 text-pink-500"></i> 
                        ChronoCraft
                    </h1>
                    <p class="text-gray-600 dark:text-gray-400 text-md mt-1">Your Personal Time Weaver</p>
                    <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mt-2">Age Calculator</h2>
                </div>
                
                <!-- Theme Toggle Button (Positioned absolutely on the right for clean centering) -->
                <button id="theme-toggle" title="Toggle theme" class="p-2 rounded-full text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all focus-visible-ring absolute right-0 top-0 mt-2 md:mt-0">
                    <i id="theme-icon-sun" data-lucide="sun" class="w-6 h-6"></i>
                    <i id="theme-icon-moon" data-lucide="moon" class="w-6 h-6"></i>
                </button>
            </header>

            <!-- Input Form -->
            <section id="input-form" class="mb-8">
                <div class="space-y-6">
                    
                    <!-- 1. Date Inputs (Full Width Row) -->
                    <div class="space-y-3">
                        <label for="day" class="text-base font-semibold text-gray-700 dark:text-gray-300">Date of Birth</label>
                        <div class="grid grid-cols-3 gap-3">
                            <input type="number" id="day" placeholder="DD" min="1" max="31" class="w-full p-3 text-center rounded-lg bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:border-indigo-500 dark:focus:border-indigo-500 outline-none focus-visible-ring" aria-label="Day of Birth">
                            <input type="number" id="month" placeholder="MM" min="1" max="12" class="w-full p-3 text-center rounded-lg bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:border-indigo-500 dark:focus:border-indigo-500 outline-none focus-visible-ring" aria-label="Month of Birth">
                            <input type="number" id="year" placeholder="YYYY" min="1900" max="2100" class="w-full p-3 text-center rounded-lg bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:border-indigo-500 dark:focus:border-indigo-500 outline-none focus-visible-ring" aria-label="Year of Birth">
                        </div>
                    </div>
                    
                    <!-- 2. Time Inputs (Full Width Row - now below Date of Birth) -->
                    <div class="space-y-3">
                        <label for="hour" class="text-base font-semibold text-gray-700 dark:text-gray-300">Time of Birth <span class="text-sm font-normal opacity-70">(Optional)</span></label>
                        <div class="grid grid-cols-3 gap-3 max-w-sm"> <!-- Restricted width for time inputs for visual balance -->
                            <input type="number" id="hour" placeholder="HH" min="1" max="12" class="w-full p-3 text-center rounded-lg bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:border-indigo-500 dark:focus:border-indigo-500 outline-none focus-visible-ring" aria-label="Hour of Birth">
                            <input type="number" id="minute" placeholder="MM" min="0" max="59" class="w-full p-3 text-center rounded-lg bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:border-indigo-500 dark:focus:border-indigo-500 outline-none focus-visible-ring" aria-label="Minute of Birth">
                            <select id="ampm" class="w-full p-3 text-center rounded-lg bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:border-indigo-500 dark:focus:border-indigo-500 outline-none focus-visible-ring cursor-pointer" aria-label="AM or PM">
                                <option>AM</option>
                                <option>PM</option>
                            </select>
                        </div>
                    </div>

                    <!-- 3. Actions and Settings (Full Width Row) -->
                    <div class="space-y-4">
                        
                        <!-- Calculate Button (Primary action) -->
                        <!-- UPDATED: Calculate button is now only w-full on mobile, medium size on desktop -->
                        <button id="calculate-btn" class="w-full md:w-64 p-3.5 rounded-lg bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold text-lg shadow-lg hover:opacity-90 transition-all transform hover:scale-[1.005] active:scale-100 focus-visible-ring">
                            Calculate
                        </button>
                        
                        <!-- Secondary Actions: Checkbox and Reset -->
                        <div class="flex flex-col sm:flex-row sm:justify-between items-start sm:items-center gap-4">
                            <!-- UPDATED: Checkbox moved to the left -->
                            <div class="flex items-center order-first">
                                <input type="checkbox" id="save-data" class="h-4 w-4 text-indigo-600 dark:text-indigo-500 focus:ring-indigo-500 border-gray-300 rounded dark:bg-gray-700 dark:border-gray-600 focus-visible-ring">
                                <label for="save-data" class="ml-2 block text-sm text-gray-700 dark:text-gray-300 cursor-pointer select-none">Remember my birthday</label>
                            </div>
                            <!-- Reset Button moved to the right -->
                            <button id="reset-btn" class="w-full sm:w-auto flex-shrink-0 px-4 py-2.5 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 font-semibold text-sm hover:bg-gray-300 dark:hover:bg-gray-600 transition-all focus-visible-ring order-last">
                                Reset
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Error Message Area -->
            <div id="error-message" class="text-red-500 dark:text-red-400 text-center mb-6 text-lg font-medium hidden"></div>

            <!-- Results Section -->
            <section id="results-container" class="hidden space-y-8 mt-10">
                
                <!-- Precise Age & Next Birthday Countdown -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Your Precise Age Card -->
                    <div class="bg-gray-50 dark:bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700">
                        <h2 class="flex items-center gap-2 text-xl font-semibold text-gray-700 dark:text-gray-300 mb-5">
                            <i data-lucide="clock" class="w-6 h-6 text-indigo-500"></i>
                            Your Precise Age
                        </h2>
                        <div id="age-display" class="grid grid-cols-3 md:grid-cols-3 lg:grid-cols-3 gap-y-4 gap-x-2 text-center text-gray-900 dark:text-white">
                            <!-- Content injected by JS -->
                        </div>
                    </div>

                    <!-- Next Birthday Countdown Card -->
                    <div class="bg-gray-50 dark:bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700">
                        <h2 class="flex items-center gap-2 text-xl font-semibold text-gray-700 dark:text-gray-300 mb-5">
                            <i data-lucide="gift" class="w-6 h-6 text-purple-500"></i>
                            Next Birthday Countdown
                        </h2>
                        <div id="countdown-display" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-4 gap-y-4 gap-x-2 text-center text-gray-900 dark:text-white">
                            <!-- Content injected by JS -->
                        </div>
                    </div>
                </div>

                <!-- Zodiac, Chinese Zodiac, Born On -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Zodiac Sign Card -->
                    <div class="bg-gray-50 dark:bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 flex flex-col items-center">
                        <h2 class="flex items-center gap-2 text-base font-medium text-gray-500 dark:text-gray-400 mb-3">
                            <i data-lucide="star" class="w-5 h-5 text-indigo-400"></i>
                            Zodiac Sign
                        </h2>
                        <span id="zodiac" class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-500 block"></span>
                    </div>
                    <!-- Chinese Zodiac Card -->
                    <div class="bg-gray-50 dark:bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 flex flex-col items-center">
                        <h2 class="flex items-center gap-2 text-base font-medium text-gray-500 dark:text-gray-400 mb-3">
                            <i data-lucide="paw-print" class="w-5 h-5 text-purple-400"></i>
                            Chinese Zodiac
                        </h2>
                        <span id="chineseZodiac" class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-500 block"></span>
                    </div>
                    <!-- Born On Card -->
                    <div class="bg-gray-50 dark:bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 flex flex-col items-center">
                        <h2 class="flex items-center gap-2 text-base font-medium text-gray-500 dark:text-gray-400 mb-3">
                            <i data-lucide="calendar-days" class="w-5 h-5 text-pink-400"></i>
                            Born on a
                        </h2>
                        <span id="dayOfWeek" class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-500 block"></span>
                    </div>
                </div>

                <!-- Birthday Snapshot Section -->
                <div class="bg-gray-50 dark:bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700">
                    <h2 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-teal-500 text-center mb-6">Your Birthday Snapshot</h2>
                    
                    <div class="space-y-6">
                        <!-- Personality Trait -->
                        <div>
                            <h3 class="flex items-center gap-2 text-lg font-semibold text-gray-700 dark:text-gray-300 mb-2">
                                <i data-lucide="sparkles" class="w-5 h-5 text-yellow-500"></i>
                                Personality Trait
                            </h3>
                            <p id="trait" class="text-gray-600 dark:text-gray-300 leading-relaxed"></p>
                        </div>

                        <!-- Famous Peers -->
                        <div>
                            <h3 class="flex items-center gap-2 text-lg font-semibold text-gray-700 dark:text-gray-300 mb-2">
                                <i data-lucide="users" class="w-5 h-5 text-green-500"></i>
                                Famous Peers
                            </h3>
                            <ul id="famousPeers" class="list-disc list-inside text-gray-600 dark:text-gray-300 space-y-1 pl-4">
                                <!-- Content injected by JS based on birth date/zodiac for more dynamic data -->
                            </ul>
                        </div>

                        <!-- On This Day in History -->
                        <div>
                            <h3 class="flex items-center gap-2 text-lg font-semibold text-gray-700 dark:text-gray-300 mb-2">
                                <i data-lucide="scroll" class="w-5 h-5 text-red-500"></i>
                                On This Day in History
                            </h3>
                            <p id="historyFact" class="text-gray-600 dark:text-gray-300 leading-relaxed"></p>
                        </div>
                    </div>
                </div>

            </section>
            
            <!-- AdSense Placeholder -->
            <div class="mt-8">
                <!-- 
                  IMPORTANT: Replace '1234567890' with your actual AdSense ad unit slot ID.
                  This is just a placeholder and will not serve ads.
                  data-ad-format changed to 'fluid' to help with responsiveness.
                -->
                <!-- Ad wrapper added for guaranteed min-width and delayed loading for AdSense -->
                <div id="ad-wrapper" class="ads-wrapper w-full overflow-hidden min-w-[250px]">
                    <ins class="adsbygoogle"
                         style="display:block;"
                         data-ad-client="ca-pub-5173549373434570"
                         data-ad-slot="1234567890" 
                         data-ad-format="fluid"
                         data-full-width-responsive="true"></ins>
                </div>
                <!-- Ad push logic is now in the delayed JavaScript block at the end -->
            </div>
            <!-- End AdSense Placeholder -->

        </div>
    </main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- DOM Elements ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const dayEl = document.getElementById('day');
        const monthEl = document.getElementById('month');
        const yearEl = document.getElementById('year');
        const hourEl = document.getElementById('hour');
        const minuteEl = document.getElementById('minute');
        const ampmEl = document.getElementById('ampm');
        const calcBtn = document.getElementById('calculate-btn');
        const resetBtn = document.getElementById('reset-btn'); // New reset button
        const saveDataCheckbox = document.getElementById('save-data'); // New checkbox
        const errorEl = document.getElementById('error-message');
        const resultsContainer = document.getElementById('results-container');
        
        // Result fields
        const ageDisplayEl = document.getElementById('age-display');
        const countdownDisplayEl = document.getElementById('countdown-display'); // Renamed for clarity
        const dayOfWeekEl = document.getElementById('dayOfWeek');
        const zodiacEl = document.getElementById('zodiac');
        const chineseZodiacEl = document.getElementById('chineseZodiac');
        const traitEl = document.getElementById('trait');
        const famousPeersEl = document.getElementById('famousPeers');
        const historyFactEl = document.getElementById('historyFact');

        let liveInterval; // To store the setInterval ID

        // --- Theme Toggle Logic ---
        const applyTheme = (theme) => {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            // Re-render icons after theme change
            lucide.createIcons();
        };

        const toggleTheme = () => {
            const currentTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            applyTheme(newTheme);
        };

        themeToggleBtn.addEventListener('click', toggleTheme);

        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        applyTheme(savedTheme);

        // --- Persistent Data Logic (Save/Load) ---
        const saveInputData = () => {
            if (saveDataCheckbox.checked) {
                localStorage.setItem('dobDay', dayEl.value);
                localStorage.setItem('dobMonth', monthEl.value);
                localStorage.setItem('dobYear', yearEl.value);
                localStorage.setItem('dobHour', hourEl.value);
                localStorage.setItem('dobMinute', minuteEl.value);
                localStorage.setItem('dobAMPM', ampmEl.value);
                localStorage.setItem('saveDataChecked', 'true');
            } else {
                localStorage.removeItem('dobDay');
                localStorage.removeItem('dobMonth');
                localStorage.removeItem('dobYear');
                localStorage.removeItem('dobHour');
                localStorage.removeItem('dobMinute');
                localStorage.removeItem('dobAMPM');
                localStorage.removeItem('saveDataChecked');
            }
        };

        const loadInputData = () => {
            if (localStorage.getItem('saveDataChecked') === 'true') {
                dayEl.value = localStorage.getItem('dobDay') || '';
                monthEl.value = localStorage.getItem('dobMonth') || '';
                yearEl.value = localStorage.getItem('dobYear') || '';
                hourEl.value = localStorage.getItem('dobHour') || '';
                minuteEl.value = localStorage.getItem('dobMinute') || '';
                ampmEl.value = localStorage.getItem('dobAMPM') || 'AM';
                saveDataCheckbox.checked = true;

                // Automatically calculate if data is loaded
                if (dayEl.value && monthEl.value && yearEl.value) {
                    handleCalculate();
                }
            } else {
                saveDataCheckbox.checked = false;
            }
        };
        
        // Load data on initial page load
        loadInputData();

        // Save data when checkbox changes or calculate button is clicked
        saveDataCheckbox.addEventListener('change', saveInputData);
        calcBtn.addEventListener('click', saveInputData);


        // --- Calculation Logic ---
        calcBtn.addEventListener('click', handleCalculate);
        resetBtn.addEventListener('click', resetForm); // Add reset listener

        function resetForm() {
            dayEl.value = '';
            monthEl.value = '';
            yearEl.value = '';
            hourEl.value = '';
            minuteEl.value = '';
            ampmEl.value = 'AM';
            errorEl.classList.add('hidden');
            resultsContainer.classList.add('hidden');
            clearInterval(liveInterval); // Stop any running timer
            // Optionally uncheck save data on reset
            // saveDataCheckbox.checked = false; 
            // saveInputData(); // This would clear saved data
        }

        function handleCalculate() {
            clearInterval(liveInterval); // Stop any previous timer
            errorEl.classList.add('hidden'); // Hide old errors

            // Get and parse values
            const d = parseInt(dayEl.value);
            const m = parseInt(monthEl.value) - 1; // JS months are 0-11
            const y = parseInt(yearEl.value);
            let hr = parseInt(hourEl.value) || 0; // Default to 0 if empty
            const min = parseInt(minuteEl.value) || 0; // Default to 0 if empty
            const ampm = ampmEl.value;
            
            // --- Input Validation ---
            if (isNaN(d) || isNaN(m) || isNaN(y)) {
                showError('Please enter a valid day, month, and year.');
                return;
            }
            if (y < 1900 || y > new Date().getFullYear()) { // Limit year to current year
                showError(`Please enter a year between 1900 and ${new Date().getFullYear()}.`);
                return;
            }
            // Check for invalid dates like Feb 30
            const tempDate = new Date(y, m, d);
            if (tempDate.getDate() !== d || tempDate.getMonth() !== m || tempDate.getFullYear() !== y) {
                showError('That date doesn\'t exist. Please check your values.');
                return;
            }

            // Adjust hour for PM
            if (ampm === 'PM' && hr < 12) hr += 12;
            if (ampm === 'AM' && hr === 12) hr = 0; // Midnight case

            const birthDate = new Date(y, m, d, hr, min);

            if (birthDate > new Date()) {
                showError('Date of birth cannot be in the future.');
                return;
            }

            // Initial UI update
            updateUI(birthDate);
            
            // Start live timer
            liveInterval = setInterval(() => updateUI(birthDate), 1000);

            // Show results
            resultsContainer.classList.remove('hidden');
        }

        function updateUI(birthDate) {
            const now = new Date();
            
            // 1. Precise Age (Years, Months, Days, etc.)
            let years = now.getFullYear() - birthDate.getFullYear();
            let months = now.getMonth() - birthDate.getMonth();
            let days = now.getDate() - birthDate.getDate();
            let hours = now.getHours() - birthDate.getHours();
            let minutes = now.getMinutes() - birthDate.getMinutes();
            let seconds = now.getSeconds() - birthDate.getSeconds();

            // Handle "borrows"
            if (seconds < 0) { seconds += 60; minutes--; }
            if (minutes < 0) { minutes += 60; hours--; }
            if (hours < 0) { hours += 24; days--; }
            if (days < 0) { 
                // Calculate days in the month *before* the current month
                const daysInPrevMonth = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
                days += daysInPrevMonth; 
                months--; 
            }
            if (months < 0) { months += 12; years--; }

            ageDisplayEl.innerHTML = `
                <div class="flex flex-col items-center p-3 rounded-lg bg-gray-100 dark:bg-gray-700/50">
                    <span class="text-3xl lg:text-4xl font-extrabold text-indigo-500 dark:text-indigo-400 leading-none">${years}</span>
                    <span class="text-xs uppercase text-gray-500 dark:text-gray-400 mt-1">Years</span>
                </div>
                <div class="flex flex-col items-center p-3 rounded-lg bg-gray-100 dark:bg-gray-700/50">
                    <span class="text-3xl lg:text-4xl font-extrabold text-indigo-500 dark:text-indigo-400 leading-none">${months}</span>
                    <span class="text-xs uppercase text-gray-500 dark:text-gray-400 mt-1">Months</span>
                </div>
                <div class="flex flex-col items-center p-3 rounded-lg bg-gray-100 dark:bg-gray-700/50">
                    <span class="text-3xl lg:text-4xl font-extrabold text-indigo-500 dark:text-indigo-400 leading-none">${days}</span>
                    <span class="text-xs uppercase text-gray-500 dark:text-gray-400 mt-1">Days</span>
                </div>
                <div class="flex flex-col items-center p-3 rounded-lg bg-gray-100 dark:bg-gray-700/50">
                    <span class="text-3xl lg:text-4xl font-extrabold text-purple-500 dark:text-purple-400 leading-none">${hours}</span>
                    <span class="text-xs uppercase text-gray-500 dark:text-gray-400 mt-1">Hours</span>
                </div>
                <div class="flex flex-col items-center p-3 rounded-lg bg-gray-100 dark:bg-gray-700/50">
                    <span class="text-3xl lg:text-4xl font-extrabold text-purple-500 dark:text-purple-400 leading-none">${minutes}</span>
                    <span class="text-xs uppercase text-gray-500 dark:text-gray-400 mt-1">Minutes</span>
                </div>
                <div class="flex flex-col items-center p-3 rounded-lg bg-gray-100 dark:bg-gray-700/50">
                    <span class="text-3xl lg:text-4xl font-extrabold text-purple-500 dark:text-purple-400 leading-none">${seconds}</span>
                    <span class="text-xs uppercase text-gray-500 dark:text-gray-400 mt-1">Seconds</span>
                </div>
            `;

            // 2. Next Birthday Countdown
            let nextBirthday = new Date(now.getFullYear(), birthDate.getMonth(), birthDate.getDate(), birthDate.getHours(), birthDate.getMinutes());
            if (nextBirthday < now) {
                nextBirthday.setFullYear(now.getFullYear() + 1);
            }
            let countdownDiff = nextBirthday - now;
            let cd_d = Math.floor(countdownDiff / (1000 * 60 * 60 * 24));
            let cd_h = Math.floor((countdownDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            let cd_m = Math.floor((countdownDiff % (1000 * 60 * 60)) / (1000 * 60));
            let cd_s = Math.floor((countdownDiff % (1000 * 60)) / 1000);

            countdownDisplayEl.innerHTML = `
                <div class="flex flex-col items-center p-3 rounded-lg bg-gray-100 dark:bg-gray-700/50">
                    <span class="text-3xl lg:text-4xl font-extrabold text-purple-500 dark:text-purple-400 leading-none">${cd_d}</span>
                    <span class="text-xs uppercase text-gray-500 dark:text-gray-400 mt-1">Days</span>
                </div>
                <div class="flex flex-col items-center p-3 rounded-lg bg-gray-100 dark:bg-gray-700/50">
                    <span class="text-3xl lg:text-4xl font-extrabold text-purple-500 dark:text-purple-400 leading-none">${cd_h}</span>
                    <span class="text-xs uppercase text-gray-500 dark:text-gray-400 mt-1">Hours</span>
                </div>
                <div class="flex flex-col items-center p-3 rounded-lg bg-gray-100 dark:bg-gray-700/50">
                    <span class="text-3xl lg:text-4xl font-extrabold text-purple-500 dark:text-purple-400 leading-none">${cd_m}</span>
                    <span class="text-xs uppercase text-gray-500 dark:text-gray-400 mt-1">Minutes</span>
                </div>
                <div class="flex flex-col items-center p-3 rounded-lg bg-gray-100 dark:bg-gray-700/50">
                    <span class="text-3xl lg:text-4xl font-extrabold text-purple-500 dark:text-purple-400 leading-none">${cd_s}</span>
                    <span class="text-xs uppercase text-gray-500 dark:text-gray-400 mt-1">Seconds</span>
                </div>
            `;

            // 3. Day of Week
            dayOfWeekEl.textContent = birthDate.toLocaleDateString('en-US', { weekday: 'long' });
            
            // 4. Zodiac & Personality
            const zodiac = getZodiac(birthDate.getDate(), birthDate.getMonth() + 1);
            const animals = ['Rat', 'Ox', 'Tiger', 'Rabbit', 'Dragon', 'Snake', 'Horse', 'Goat', 'Monkey', 'Rooster', 'Dog', 'Pig'];
            const chinese = animals[(birthDate.getFullYear() - 4) % 12];
            
            zodiacEl.textContent = zodiac;
            chineseZodiacEl.textContent = chinese;
            traitEl.textContent = `You are a dynamic individual, blending the ${zodiac}'s insightful and communicative nature with the ${chinese}'s boundless energy and desire for freedom. This combination makes you incredibly charming, adaptable, and always ready for new experiences and intellectual pursuits. You thrive in social settings and value your independence.`;

            // 5. Famous Peers (Example, can be expanded or made dynamic)
            famousPeersEl.innerHTML = `
                <li>George Clooney (actor)</li>
                <li>Marilyn Monroe (actress)</li>
                <li>Prince (musician)</li>
                <li>Angelina Jolie (actress)</li>
            `; // Example peers, ideally these would be more dynamically linked to birth month/day or zodiac

            // 6. On This Day in History (Example, can be expanded or made dynamic)
            historyFactEl.textContent = `On this very day in ${birthDate.getFullYear()}, a significant historical event took place! For example, on a similar day in 1906, the Wright brothers were granted a U.S. patent for their 'flying machine,' soaring into history and changing the world forever!`;
            // This can be made dynamic by fetching actual events for the given birth date.
            
            lucide.createIcons(); // Re-render Lucide icons after updating innerHTML
        }

        function getZodiac(day, month) {
            const zodiacSigns = ['Capricorn', 'Aquarius', 'Pisces', 'Aries', 'Taurus', 'Gemini', 'Cancer', 'Leo', 'Virgo', 'Libra', 'Scorpio', 'Sagittarius'];
            const lastDay = [19, 18, 20, 19, 20, 20, 22, 22, 22, 23, 21, 21];
            return (day > lastDay[month - 1]) ? zodiacSigns[month % 12] : zodiacSigns[month - 1];
        }

        function showError(message) {
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
            resultsContainer.classList.add('hidden'); // Hide results on new error
            clearInterval(liveInterval); // Stop live interval if there's an error
        }

        // --- AdSense Load Fix ---
        window.onload = function() {
            // Delay the ad push until the window is fully loaded (DOM and CSS finalized).
            // This prevents the 'availableWidth=0' error.
            setTimeout(function() {
                try {
                    (window.adsbygoogle = window.adsbygoogle || []).push({});
                    console.log("AdSense push completed successfully.");
                } catch (e) {
                    console.error("Error pushing AdSense ad:", e);
                }
            }, 100); 
        };

        // --- Initial Icon Render ---
        lucide.createIcons();
    });
</script>
